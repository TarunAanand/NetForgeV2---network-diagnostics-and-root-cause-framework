[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "0.2.0"
description = "NetForge Network Diagnostics Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
    "pydantic>=2.13.5",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
netforge = "cli:app"

[tool.setuptools.packages.find]
include = [
    "core*",
    "diagnostics*",
    "analysis*",
    "ingest*",
    "collectors*",
    "storage*",
    "agent*",
    "controller*",
]

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
